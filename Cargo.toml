[package]
name = "admin-toolkit"
version = "0.1.0"
edition = "2021"
description = "Swiss-army-knife TUI toolkit for sysadmins: SSH user provisioning, DataBase user management, GoDaddy DNS management"
authors = ["or1k.net"]
homepage = "https://or1k.net"

[[bin]]
name = "atk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
ratatui = "0.29"
crossterm = "0.28"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
arboard = "3"
regex = "1"
mysql = { version = "25", default-features = false, features = ["minimal"] }
postgres = "0.19"
